<html>

<head>
    <title>Ejercicio de Tabla</title>
    <style>
        table {
            border: 0px;
            margin: auto;
            border-spacing: 10px;
            width: 400px;
            height: 400px;
            background-color: black;

        }
    </style>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <table id="table">
        <tr>
            <td colspan="2" id="rojo"></td>
            <td id="blanco"></td>
            <td id="azul"></td>
        </tr>
        <tr>
            <td rowspan="2" id="amarillo"></td>
            <td id="blanco"></td>
            <td rowspan="2" colspan="2" id="rojo"></td>
        </tr>
        <tr>
            <td id="azul"></td>
        </tr>
        <tr>
            <td id="rojo"></td>
            <td id="blanco"></td>
            <td id="amarillo"></td>
            <td id="azul"></td>
        </tr>
    </table>
</body>

</html>
