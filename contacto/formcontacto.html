<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>IES Augustóbriga</title>
    <meta name="description" content="Página web del IES Augustóbriga" />
    <link rel="stylesheet" href="css/estilos.css" />
    </style>
</head>

<body>
    <header>
        <figure>
            <img src="../imagenes/logoaugustobriga.png" width="100" height="100" alt="Logotipo del IES Augustóbriga">
            <figcaption>Fig.1 Logo IES Augustóbriga</figcaption>
        </figure>
        <h1>IES Augustóbriga</h1>
    </header>
    <nav>
        <a href="#noticias">Noticias</a>
        <a href="#actividades">| Actividades</a>
        <a href="./contacto/formcontacto.html" target="_blank" title="Contacto">| Contacto</a>
        <a href="../index.html" target="_self" title="Inicio">| Inicio</a>
    </nav>
    <main>

        <section id="contacto">
            <form action="procesar.php" method="post">
                <fieldset>
                    <legend>Formulario de contacto</legend>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>

                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email" required>

                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" required>

                    <label for="fecha">Fecha de visita:</label>
                    <input type="date" id="fecha" name="fecha" required>

                    <label for="motivo">Motivo:</label>
                    <select name="motivo" id="motivo">
                        <option value="info">Información</option>
                        <option value="matricula">Matrícula</option>
                        <option value="otros">Otros</option>
                    </select>

                    <label for="mensaje">Mensaje:</label>
                    <textarea name="mensaje" id="mensaje" rows="4" cols="40"></textarea>

                    <button type="submit">Enviar</button>
                    <button type="reset">Borrar</button>

                </fieldset>
            </form>
        </section>
    </main>
</body>
